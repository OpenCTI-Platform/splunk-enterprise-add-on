name: build-test-release

on: push

jobs:

  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # same Python version as the one building the package
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the app dependencies
        run: pip install -r TA-opencti-for-splunk-enterprise/package/lib/requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  build:
    needs: unit-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create subfolder
        run: mkdir my-package

      - name: Install UCC
        run: |
          pip install splunk-add-on-ucc-framework

      - name: Build an app using UCC
        # ucc-gen does not read the version from our tags (no "v" prefix): pass it explicitly
        run: ucc-gen build --source TA-opencti-for-splunk-enterprise/package --ta-version "$(jq -r .meta.version TA-opencti-for-splunk-enterprise/globalConfig.json)"

      - name: Create tmp folder
        run: mkdir app-dir

      - name: Create package
        run: ucc-gen package --path output/TA-opencti-for-splunk-enterprise -o app-dir/

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: my-package
          path: app-dir/

  run-appinspect-api:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: my-package
          path: app-dir/
      - name: appinspect-api
        uses: splunk/appinspect-api-action@v3.0
        with:
          username: ${{ secrets.SPL_COM_USER }}
          password: ${{ secrets.SPL_COM_PASSWORD }}
          app_path: app-dir/
          included_tags: "cloud,self-service"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: appinspect-api-html-report
          path: AppInspect_response.html