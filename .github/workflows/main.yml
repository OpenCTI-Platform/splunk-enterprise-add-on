name: build-test-release

on: push

jobs:

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12: Python the build job vendors lib/ with; 3.13: Python of Splunk Enterprise 10.
        # The pinned libraries (stix2 3.0.2) require Python 3.10 or later.
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the add-on runtime libraries
        run: |
          pip install -r TA-opencti-for-splunk-enterprise/package/lib/requirements.txt pytest

      - name: Run the tests
        run: python -m pytest tests -q

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create subfolder
        run: mkdir my-package

      - name: Install UCC
        run: |
          pip install splunk-add-on-ucc-framework

      - name: Build an app using UCC
        run: ucc-gen build --source TA-opencti-for-splunk-enterprise/package

      - name: Create tmp folder
        run: mkdir app-dir

      - name: Create package
        run: ucc-gen package --path output/TA-opencti-for-splunk-enterprise -o app-dir/

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: my-package
          path: app-dir/

  run-appinspect-cli:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: my-package
          path: app-dir/

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install AppInspect
        run: pip install splunk-appinspect

      - name: Inspect the package (Splunk Cloud checks)
        run: |
          splunk-appinspect inspect app-dir/*.tar.gz --mode test --included-tags cloud \
            --data-format json --output-file appinspect-cli-report.json

      - name: Fail on AppInspect failures and errors
        run: |
          python - <<'EOF'
          import json
          with open("appinspect-cli-report.json", encoding="utf-8") as handle:
              report = json.load(handle)
          summary = report["summary"]
          print(json.dumps(summary, indent=2))
          blocking = []
          for group in report["reports"][0]["groups"]:
              for check in group["checks"]:
                  if check["result"] in ("failure", "error"):
                      blocking.append(check["name"])
                      for message in check.get("messages", [])[:5]:
                          print(f"{check['result']}: {check['name']}: {message.get('message')}")
          if blocking:
              raise SystemExit(f"AppInspect blocking checks: {', '.join(sorted(set(blocking)))}")
          EOF

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: appinspect-cli-report
          path: appinspect-cli-report.json

  run-appinspect-api:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: my-package
          path: app-dir/
      - name: appinspect-api
        uses: splunk/appinspect-api-action@v3.0
        with:
          username: ${{ secrets.SPL_COM_USER }}
          password: ${{ secrets.SPL_COM_PASSWORD }}
          app_path: app-dir/
          included_tags: "cloud,self-service"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: appinspect-api-html-report
          path: AppInspect_response.html
