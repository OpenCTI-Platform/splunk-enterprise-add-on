[openctireporthits-command]
syntax = openctireporthits (id_field=<field>)? (count_field=<field>)? (first_field=<field>)? (last_field=<field>)?
shortdesc = Reports indicator hits to OpenCTI on the Splunk Security Platform.
description = Reports one row per indicator (STIX id, number of hits, first and last hit time) to OpenCTI: indicatorReportHits on platforms with dissemination assurance, a sighting Indicator -> Security Platform otherwise. Adds opencti_hit_status and opencti_hit_message to each row.
usage = public
example1 = ... | stats sum(count) AS hit_count min(_time) AS first_hit max(_time) AS last_hit by indicator_id | openctireporthits
comment1 = Report the hits counted by a search.
category = reporting
appears-in = 1.2.0
maintainer = Filigran

[openctivalidation-command]
syntax = openctivalidation (writeback=<bool>)?
shortdesc = Proves the OpenCTI IOC validation requests targeting the Splunk Security Platform.
description = Lists the IOC validation requests of OpenCTI targeting the Splunk Security Platform and decides, from the hits reported by openctireporthits, whether each benign test was detected or missed; writes the outcomes back to OpenCTI unless writeback=false.
usage = public
example1 = | openctivalidation writeback=false
comment1 = Show the validation outcomes without writing them back.
category = generating
appears-in = 1.2.0
maintainer = Filigran

[openctireconcile-command]
syntax = openctireconcile (mode=(deployments|knowledge))? (refresh=<bool>)?
shortdesc = Reconciles the OpenCTI indicators held in Splunk with OpenCTI.
description = mode=deployments repairs the drift between the opencti_indicators KV Store and the deployed-on relationships of the Splunk Security Platform (refresh=true re-reports indicators already in sync); mode=knowledge refreshes the provenance and Threat Pulse fields of the indicators.
usage = public
example1 = | openctireconcile mode=deployments refresh=true
comment1 = Repair the drift and refresh last_sync_at of every deployment.
category = generating
appears-in = 1.2.0
maintainer = Filigran

[openctiprovides-command]
syntax = openctiprovides (prune=<bool>)?
shortdesc = Declares the telemetry of Splunk to the OpenCTI defense matrix.
description = Takes rows with data_component, sources and event_count and creates provides relationships Splunk Security Platform -> MITRE Data Component in OpenCTI; prune=true deletes the ones declared earlier for data components absent from the inventory.
usage = public
example1 = | inputlookup opencti_cim_data_components | eval event_count=1, sources=source | openctiprovides
comment1 = Declare every data component of the mapping (test only).
category = reporting
appears-in = 1.2.0
maintainer = Filigran
