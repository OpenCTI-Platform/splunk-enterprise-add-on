[openctiprovides-command]
syntax = openctiprovides (prune=<bool>)?
shortdesc = Declares the telemetry of Splunk to the OpenCTI defense matrix.
description = Takes rows with data_component, sources and event_count and creates provides relationships Splunk Security Platform -> MITRE Data Component in OpenCTI; prune=true deletes the ones declared earlier for data components absent from the inventory.
usage = public
example1 = | inputlookup opencti_cim_data_components | eval event_count=1, sources=source | openctiprovides
comment1 = Declare every data component of the mapping (test only).
category = reporting
appears-in = 1.2.0
maintainer = Filigran
