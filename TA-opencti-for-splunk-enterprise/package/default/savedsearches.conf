#
# Detections: OpenCTI indicators matched against CIM data. ATT&CK techniques are
# declared in action.correlationsearch.annotations (mitre_attack), the convention
# read by Splunk Enterprise Security and by the OpenCTI splunk-saved-searches
# importer. Output fields: indicator_id, value, count, first_seen and
# last_seen.
#
[OpenCTI - Network traffic with an indicator IP]
search = | tstats `opencti_hits_summariesonly` count min(_time) AS first_seen max(_time) AS last_seen \
        from datamodel=Network_Traffic.All_Traffic where `opencti_hits_scope` by All_Traffic.dest_ip \
    | rename "All_Traffic.dest_ip" AS value \
    | eval direction="outbound" \
    | `opencti_hits_match` \
    | append [| tstats `opencti_hits_summariesonly` count min(_time) AS first_seen max(_time) AS last_seen \
        from datamodel=Network_Traffic.All_Traffic where `opencti_hits_scope` by All_Traffic.src_ip \
        | rename "All_Traffic.src_ip" AS value \
        | eval direction="inbound" \
        | `opencti_hits_match`] \
    | stats sum(count) AS count min(first_seen) AS first_seen max(last_seen) AS last_seen values(direction) AS direction by indicator_id value
description = Network traffic (CIM Network_Traffic) to or from an IP address held as an OpenCTI indicator.
action.correlationsearch.label = OpenCTI - Network traffic with an indicator IP
action.correlationsearch.annotations = {"mitre_attack": ["T1071", "T1095", "T1571"]}
enableSched = 1
disabled = 1
cron_schedule = */15 * * * *
dispatch.earliest_time = -20m@m
dispatch.latest_time = -5m@m
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.fields = indicator_id
alert.suppress.period = 1h
action.summary_index = 0

