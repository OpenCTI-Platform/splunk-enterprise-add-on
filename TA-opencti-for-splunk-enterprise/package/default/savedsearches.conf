[Update OpenCTI Marking Definition Lookup]
search = | inputlookup opencti_markings \
| append [ \
     search `opencti_index` sourcetype="opencti:marking-definition" (event="create" OR event="update") \
     | dedup id \
     | table _key id name type created definition_type sourcetype \
] \
| outputlookup append=true opencti_markings
description = Updates the opencti_markings lookup with new and updated marking definitions
schedule = */15 * * * *
enableSched = 1
disabled = 1
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */15 * * * *
alert.suppress = 0
alert.track = 0
action.summary_index = 0

[Update OpenCTI Indicators Lookup]
search = `opencti_index` sourcetype="opencti:indicator" \
        (((event="create" OR event="update") pattern_type="stix") OR event="delete") \
    | eval modified_epoch = coalesce( \
        strptime(modified, "%Y-%m-%dT%H:%M:%S.%3NZ"), strptime(modified, "%Y-%m-%dT%H:%M:%SZ"), \
        strptime(updated_at, "%Y-%m-%dT%H:%M:%S.%3NZ"), strptime(updated_at, "%Y-%m-%dT%H:%M:%SZ"), \
        strptime(created_at, "%Y-%m-%dT%H:%M:%S.%3NZ"), strptime(created_at, "%Y-%m-%dT%H:%M:%SZ"), \
        _time \
      ) \
    | eval _time = modified_epoch, is_delete = if(event=="delete", 1, 0) \
    | sort 0 id -_time -is_delete \
    | dedup id \
    | rename markings{} AS markings object_marking_refs{} AS object_marking_refs labels{} AS labels \
             attack_patterns{} AS attack_patterns malware{} AS malware threat_actors{} AS threat_actors \
             vulnerabilities{} AS vulnerabilities \
    | eval revoked = if(is_delete == 1, "true", revoked), value = if(is_delete == 1, null(), value), \
           pattern = if(is_delete == 1, null(), pattern) \
    | lookup opencti_indicators id OUTPUT added_at AS existing_added_at \
    | eval added_at_epoch = case( \
        isnotnull(existing_added_at) AND match(existing_added_at, "^\d{4}-\d{2}-\d{2}T"), \
            coalesce(strptime(existing_added_at, "%Y-%m-%dT%H:%M:%S.%3NZ"), strptime(existing_added_at, "%Y-%m-%dT%H:%M:%SZ"), now()), \
        true(), now() \
      ) \
    | eval added_at = strftime(added_at_epoch, "%Y-%m-%dT%H:%M:%S.%3NZ") \
    | eval _key = id, source_index = index \
    | table _key id created created_at created_by created_by_ref description detection indicator_types \
            input_name lang main_observable_type markings modified name object_marking_refs \
            pattern pattern_type revoked score spec_version type updated_at valid_from valid_until value \
            stream_id source_index confidence labels attack_patterns malware threat_actors vulnerabilities added_at \
    | outputlookup append=t opencti_indicators
description = Incrementally upserts OpenCTI indicators into the opencti_indicators KV Store using the latest modified event per id. A deleted indicator is written as a revoked tombstone without value or pattern, which the nightly rebuild drops.
schedule = */5 * * * *
enableSched = 1
disabled = 1
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */5 * * * *
alert.suppress = 0
alert.track = 0
action.summary_index = 0

[Nightly Rebuild OpenCTI Indicators Lookup]
search = `opencti_index` sourcetype="opencti:indicator" \
        (((event="create" OR event="update") pattern_type="stix") OR event="delete") \
    | eval modified_epoch = coalesce( \
        strptime(modified, "%Y-%m-%dT%H:%M:%S.%3NZ"), strptime(modified, "%Y-%m-%dT%H:%M:%SZ"), \
        strptime(updated_at, "%Y-%m-%dT%H:%M:%S.%3NZ"), strptime(updated_at, "%Y-%m-%dT%H:%M:%SZ"), \
        strptime(created_at, "%Y-%m-%dT%H:%M:%S.%3NZ"), strptime(created_at, "%Y-%m-%dT%H:%M:%SZ"), \
        _time \
      ) \
    | eval _time = modified_epoch, is_delete = if(event=="delete", 1, 0) \
    | sort 0 id -_time -is_delete \
    | dedup id \
    | where is_delete == 0 \
    | rename markings{} AS markings object_marking_refs{} AS object_marking_refs labels{} AS labels \
             attack_patterns{} AS attack_patterns malware{} AS malware threat_actors{} AS threat_actors \
             vulnerabilities{} AS vulnerabilities indicator_types{} as indicator_types\
    | eval added_at_epoch = coalesce( \
        strptime(created_at, "%Y-%m-%dT%H:%M:%S.%3NZ"), strptime(created_at, "%Y-%m-%dT%H:%M:%SZ"), \
        modified_epoch \
      ) \
    | eval added_at = strftime(added_at_epoch, "%Y-%m-%dT%H:%M:%S.%3NZ") \
    | eval _key = id, source_index = index \
    | table _key id created created_at created_by created_by_ref description detection indicator_types \
            input_name lang main_observable_type markings modified name object_marking_refs \
            pattern pattern_type revoked score spec_version type updated_at valid_from valid_until value \
            stream_id source_index confidence labels attack_patterns malware threat_actors vulnerabilities added_at \
    | outputlookup opencti_indicators
description = Nightly full rebuild of the OpenCTI Indicators KV store. Ensures only the latest version per id remains and clears stale entries.
schedule = 30 2 * * *
enableSched = 1
disabled = 1
dispatch.earliest_time = 0
dispatch.latest_time = now
cron_schedule = 30 2 * * *
alert.suppress = 0
alert.track = 0
action.summary_index = 0

[Update OpenCTI Reports Lookup]
search = | inputlookup opencti_reports \
| append [ \
    search `opencti_index` sourcetype="opencti:report" (event="create" OR event="update") \
    | eval added_at=now() \
    | eval added_at=strftime(added_at, "%Y-%m-%dT%H:%M:%S.%3N%z") \
    | rename markings{} AS markings object_marking_refs{} AS object_marking_refs labels{} AS labels report_types{} as report_types \
    | table _key, id, created, created_at, created_by, created_by_ref, description, report_types, input_name, markings, modified, name, score, confidence, spec_version, type, updated_at \
] \
| append [ \
     search `opencti_index` sourcetype="opencti:report" event="delete" \
     | eval delete_flag="true" \
     | table id, delete_flag \
] \
| stats values(*) AS * by id \
| where isnull(delete_flag) \
| fields - delete_flag \
| outputlookup opencti_reports
description = Updates the opencti_reports lookup with new and updated reports, while flagging deleted ones.
schedule = 0 * * * *
enableSched = 1
disabled = 1
dispatch.earliest_time = -60m
dispatch.latest_time = now
cron_schedule = 0 * * * *
alert.suppress = 0
alert.track = 0
action.summary_index = 0

#
# Dissemination assurance (OpenCTI 10): hits, validation proof, reconciliation.
# One combined hits search reports each indicator once per window (OpenCTI
# ignores a report whose last hit is not newer than the last one counted).
# The windows are snapped and do not overlap, so no hit is counted twice.
#
[OpenCTI - Report indicator hits]
search = | tstats `opencti_hits_summariesonly` count min(_time) AS first_hit max(_time) AS last_hit \
        from datamodel=Network_Traffic.All_Traffic where `opencti_hits_scope` by All_Traffic.dest_ip \
    | rename "All_Traffic.dest_ip" AS value \
    | eval opencti_value_kind="ip" | `opencti_hits_match` \
    | append [| tstats `opencti_hits_summariesonly` count min(_time) AS first_hit max(_time) AS last_hit \
        from datamodel=Network_Traffic.All_Traffic where `opencti_hits_scope` by All_Traffic.src_ip \
        | rename "All_Traffic.src_ip" AS value | eval opencti_value_kind="ip" | `opencti_hits_match`] \
    | append [| tstats `opencti_hits_summariesonly` count min(_time) AS first_hit max(_time) AS last_hit \
        from datamodel=Network_Resolution.DNS where `opencti_hits_scope` by DNS.query \
        | rename "DNS.query" AS value | eval opencti_value_kind="domain" | `opencti_hits_match`] \
    | append [| tstats `opencti_hits_summariesonly` count min(_time) AS first_hit max(_time) AS last_hit \
        from datamodel=Web.Web where `opencti_hits_scope` by Web.url \
        | rename "Web.url" AS value | eval opencti_value_kind="url" | `opencti_hits_match`] \
    | append [| tstats `opencti_hits_summariesonly` count min(_time) AS first_hit max(_time) AS last_hit \
        from datamodel=Endpoint.Filesystem where `opencti_hits_scope` by Filesystem.file_hash \
        | rex field=Filesystem.file_hash max_match=0 "(?<value>[A-Fa-f0-9]{128}|[A-Fa-f0-9]{64}|[A-Fa-f0-9]{40}|[A-Fa-f0-9]{32})" \
        | fields - Filesystem.file_hash | eval opencti_value_kind="hash" | `opencti_hits_match`] \
    | append [| tstats `opencti_hits_summariesonly` count min(_time) AS first_hit max(_time) AS last_hit \
        from datamodel=Endpoint.Processes where `opencti_hits_scope` by Processes.process_hash \
        | rex field=Processes.process_hash max_match=0 "(?<value>[A-Fa-f0-9]{128}|[A-Fa-f0-9]{64}|[A-Fa-f0-9]{40}|[A-Fa-f0-9]{32})" \
        | fields - Processes.process_hash | eval opencti_value_kind="hash" | `opencti_hits_match`] \
    | append [| tstats `opencti_hits_summariesonly` count min(_time) AS first_hit max(_time) AS last_hit \
        from datamodel=Email.All_Email where `opencti_hits_scope` by All_Email.src_user \
        | rename "All_Email.src_user" AS value | eval opencti_value_kind="email" | `opencti_hits_match`] \
    | stats sum(count) AS hit_count min(first_hit) AS first_hit max(last_hit) AS last_hit values(value) AS value by indicator_id \
    | append [| makeresults | eval opencti_hits_heartbeat = 1 | fields - _time] \
    | openctireporthits
description = Reports to OpenCTI, on the Splunk Security Platform, how many times each OpenCTI indicator matched CIM data (deployment hits, IOC validation evidence). The trailing heartbeat row records the time range as searched, which the IOC validation proof requires before it declares a miss.
action.correlationsearch.annotations = {"mitre_attack": ["T1071", "T1071.001", "T1071.004", "T1095", "T1105", "T1204.002", "T1566"]}
enableSched = 1
disabled = 1
cron_schedule = */15 * * * *
dispatch.earliest_time = -20m@m
dispatch.latest_time = -5m@m
alert.track = 0
alert.suppress = 0
action.summary_index = 0

