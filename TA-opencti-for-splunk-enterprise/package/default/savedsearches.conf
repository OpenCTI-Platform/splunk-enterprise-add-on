#
# Defense matrix (OpenCTI 09): telemetry inventory -> provides relationships.
#
[OpenCTI - Telemetry inventory]
search = | tstats `opencti_inventory_summariesonly` count from datamodel=Authentication where `opencti_inventory_scope` | eval source="datamodel:Authentication" \
    | append [| tstats `opencti_inventory_summariesonly` count from datamodel=Network_Traffic where `opencti_inventory_scope` | eval source="datamodel:Network_Traffic"] \
    | append [| tstats `opencti_inventory_summariesonly` count from datamodel=Network_Resolution where `opencti_inventory_scope` | eval source="datamodel:Network_Resolution"] \
    | append [| tstats `opencti_inventory_summariesonly` count from datamodel=Web where `opencti_inventory_scope` | eval source="datamodel:Web"] \
    | append [| tstats `opencti_inventory_summariesonly` count from datamodel=Network_Sessions where `opencti_inventory_scope` | eval source="datamodel:Network_Sessions"] \
    | append [| tstats `opencti_inventory_summariesonly` count from datamodel=Intrusion_Detection where `opencti_inventory_scope` | eval source="datamodel:Intrusion_Detection"] \
    | append [| tstats `opencti_inventory_summariesonly` count from datamodel=Email where `opencti_inventory_scope` | eval source="datamodel:Email"] \
    | append [| tstats `opencti_inventory_summariesonly` count from datamodel=Endpoint.Processes where `opencti_inventory_scope` | eval source="datamodel:Endpoint.Processes"] \
    | append [| tstats `opencti_inventory_summariesonly` count from datamodel=Endpoint.Filesystem where `opencti_inventory_scope` | eval source="datamodel:Endpoint.Filesystem"] \
    | append [| tstats `opencti_inventory_summariesonly` count from datamodel=Endpoint.Registry where `opencti_inventory_scope` | eval source="datamodel:Endpoint.Registry"] \
    | append [| tstats `opencti_inventory_summariesonly` count from datamodel=Endpoint.Services where `opencti_inventory_scope` | eval source="datamodel:Endpoint.Services"] \
    | append [| tstats `opencti_inventory_summariesonly` count from datamodel=Change where `opencti_inventory_scope` | eval source="datamodel:Change"] \
    | append [| tstats `opencti_inventory_summariesonly` count from datamodel=Data_Access where `opencti_inventory_scope` | eval source="datamodel:Data_Access"] \
    | append [| metadata type=sourcetypes `opencti_inventory_scope` | where recentTime >= relative_time(now(), "-7d") | eval source="sourcetype:".sourcetype, count=totalCount | fields source count] \
    | where count > 0 \
    | lookup opencti_cim_data_components source OUTPUT data_component \
    | where isnotnull(data_component) \
    | mvexpand data_component \
    | stats sum(count) AS event_count values(source) AS sources by data_component \
    | openctiprovides
description = Inventories the CIM data models and sourcetypes holding data, maps them to MITRE Data Components (lookup opencti_cim_data_components) and declares them to OpenCTI as provides relationships of the Splunk Security Platform.
enableSched = 1
disabled = 1
cron_schedule = 10 4 * * *
dispatch.earliest_time = -7d@d
dispatch.latest_time = now
alert.track = 0
alert.suppress = 0
action.summary_index = 0
