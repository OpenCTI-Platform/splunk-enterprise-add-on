#
# Indicator Collections
#
[opencti_indicators]
external_type = kvstore
collection = opencti_indicators
case_sensitive_match = false
fields_list = _key, id, name, pattern, revoked, type, value, detection, score, main_observable_type, confidence, labels, created_by, markings, valid_from, valid_until, indicator_types, added_at, input_name, stream_id, attack_patterns, malware, threat_actors, vulnerabilities, corroboration_count, assertions_count, first_asserted_at, last_asserted_at, single_sourced, has_conflicts, freshness_stale, sources, sources_by_kind, pulse_prevalence, pulse_trend, pulse_first_seen_network, pulse_platforms_bucket, pulse_preview

[opencti_reports]
external_type = kvstore
collection = opencti_reports
case_sensitive_match = false
fields_list = _key, id, name, type, description, author, labels, created, created_at, created_by, created_by_ref, report_types, modified, score, confidence, spec_version, updated_at, markings, published, added_at, input_name, stream_id

[opencti_identities]
external_type = kvstore
collection = opencti_identities
case_sensitive_match = false
fields_list = _key, id, name, description, created_at, updated_at, x_opencti_organization_type, input_name, stream_id

[opencti_markings]
external_type = kvstore
collection = opencti_markings
case_sensitive_match = false
fields_list = _key, id, name, type, definition, definition_type, created_at, sourcetype, input_name, stream_id

#
# Program write-back state (read by the Monitoring dashboard)
#
[opencti_deployments]
external_type = kvstore
collection = opencti_deployments
case_sensitive_match = false
fields_list = _key, indicator_id, status, external_id, result, error, reported_at

[opencti_indicator_hits]
external_type = kvstore
collection = opencti_indicator_hits
case_sensitive_match = false
fields_list = _key, indicator_id, value, type, platform_id, hit_count, first_hit, last_hit, recent_windows, last_status, last_reported_at

[opencti_validation_results]
external_type = kvstore
collection = opencti_validation_results
case_sensitive_match = false
fields_list = _key, request_id, request_name, indicator_id, value, test_kind, outcome, first_matching_hit, reported, channel, decided_at

[opencti_provides]
external_type = kvstore
collection = opencti_provides
case_sensitive_match = false
fields_list = _key, platform_id, data_component, data_component_ids, relationship_ids, sources, event_count, status, reported_at

#
# Telemetry -> MITRE Data Component mapping (editable)
# source: "datamodel:<Data_Model>[.<Dataset>]" or "sourcetype:<sourcetype>", wildcards allowed
#
[opencti_cim_data_components]
filename = opencti_cim_data_components.csv
match_type = WILDCARD(source)
case_sensitive_match = false
max_matches = 100
