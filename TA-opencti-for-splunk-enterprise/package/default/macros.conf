[opencti_index]
definition = index=opencti_stream
description = Specify the index used for OpenCTI data.
iseval = 0

#
# Indicator matching (OpenCTI - * detection searches)
#
[opencti_hits_scope]
definition = index=*
description = Data the detection searches match against the indicators, used in the where clause of tstats (for example index=proxy OR index=firewall).
iseval = 0

[opencti_hits_summariesonly]
definition = summariesonly=false allow_old_summaries=true
description = tstats options of the detection searches. Set summariesonly=true when the CIM data models are accelerated.
iseval = 0

[opencti_usable_indicator]
definition = (isnull(revoked) OR isnull(mvfind(revoked, "(?i)^(1|true)$"))) \
    AND (isnull(valid_until) OR coalesce(strptime(valid_until, "%Y-%m-%dT%H:%M:%S.%3NZ"), strptime(valid_until, "%Y-%m-%dT%H:%M:%SZ"), now() + 1) > now())
description = where clause keeping indicators that are neither revoked nor expired (opencti_indicators lookup output: revoked, valid_until); a multivalue revoked counts as revoked when any of its values is.
iseval = 0

[opencti_kind_indicator]
definition = (isnull(opencti_value_kind) \
    OR (opencti_value_kind == "ip" AND match(indicator_type, "^ipv[46]-addr$")) \
    OR (opencti_value_kind == "domain" AND match(indicator_type, "^(domain-name|hostname)$")) \
    OR (opencti_value_kind == "url" AND indicator_type == "url") \
    OR (opencti_value_kind == "hash" AND match(indicator_type, "^(md5|sha1|sha256)$")) \
    OR (opencti_value_kind == "email" AND indicator_type == "email-addr"))
description = where clause keeping indicators whose observable type fits the kind of the matched value (opencti_value_kind: ip, domain, url, hash, email), so a value only hits the indicators of its kind; rows without opencti_value_kind keep every type.
iseval = 0

[opencti_exact_url_indicator]
definition = (isnull(indicator_type) OR indicator_type != "url" \
    OR (lower(value) == lower(indicator_value) \
        AND replace(value, "^([A-Za-z][A-Za-z0-9+.-]*://)?[^/?#]*", "") == replace(indicator_value, "^([A-Za-z][A-Za-z0-9+.-]*://)?[^/?#]*", "")))
description = where clause keeping a URL indicator only for its exact URL (opencti_indicators lookup output: type AS indicator_type, value AS indicator_value): the lookup ignores case, so the scheme and host match in any case and the path, query and fragment must match exactly; other indicator types pass.
iseval = 0

[opencti_hits_match]
definition = eval value = mvdedup(value) \
| mvexpand value \
| lookup opencti_indicators value OUTPUT id AS indicator_id \
| where isnotnull(indicator_id) \
| eval indicator_id = mvdedup(indicator_id) \
| mvexpand indicator_id \
| lookup opencti_indicators id AS indicator_id OUTPUT revoked valid_until type AS indicator_type value AS indicator_value \
| where `opencti_usable_indicator` AND `opencti_kind_indicator` AND `opencti_exact_url_indicator` \
| fields - indicator_value
description = Match a "value" field against the OpenCTI indicators held in Splunk: one row per matched value and indicator (several indicators can share a value, a multivalue value such as the digests of one hash field is expanded first so each indicator keeps the value it matched), revoked and expired ones left out, a URL indicator only for its exact URL; set opencti_value_kind (ip, domain, url, hash, email) first to keep the indicators of that kind only.
iseval = 0

#
# Telemetry inventory (OpenCTI - Telemetry inventory)
#
[opencti_inventory_scope]
definition = index=*
description = Data inventoried for the defense matrix telemetry (tstats where clause and metadata scope).
iseval = 0

[opencti_inventory_summariesonly]
definition = summariesonly=true allow_old_summaries=true
description = tstats options of the telemetry inventory. With summariesonly=true only accelerated data models count.
iseval = 0
