[opencti_index]
definition = index=opencti_stream
description = Specify the index used for OpenCTI data.
iseval = 0

#
# Indicator hits (OpenCTI - Report indicator hits, OpenCTI - * detection searches)
#
[opencti_hits_scope]
definition = index=*
description = Data searched for indicator hits, used in the where clause of tstats (for example index=proxy OR index=firewall).
iseval = 0

[opencti_hits_summariesonly]
definition = summariesonly=false allow_old_summaries=true
description = tstats options of the hit searches. Set summariesonly=true when the CIM data models are accelerated.
iseval = 0

[opencti_usable_indicator]
definition = (isnull(revoked) OR NOT match(lower(tostring(revoked)), "^(1|true)$"))
description = where clause keeping indicators that are not revoked (opencti_indicators lookup output).
iseval = 0

[opencti_hits_match]
definition = lookup opencti_indicators value OUTPUT id AS indicator_id revoked \
| where isnotnull(indicator_id) AND `opencti_usable_indicator`
description = Match a "value" field against the OpenCTI indicators held in Splunk.
iseval = 0

#
# Lookup filter examples on the provenance (OpenCTI 06) and Threat Pulse (OpenCTI 04) fields.
# Fields are absent on platforms without these features: the filters then keep nothing,
# so wrap them, for example: where isnull(corroboration_count) OR `opencti_corroborated_indicator(2)`
#
[opencti_corroborated_indicator(1)]
args = min_sources
definition = (tonumber(corroboration_count) >= $min_sources$)
description = where clause: indicators asserted by at least min_sources distinct sources.
validation = isnum(min_sources)
errormsg = min_sources must be a number
iseval = 0

[opencti_multi_sourced_indicator]
definition = (NOT match(lower(tostring(single_sourced)), "^(1|true)$"))
description = where clause: indicators asserted by more than one source.
iseval = 0

[opencti_fresh_indicator]
definition = (NOT match(lower(tostring(freshness_stale)), "^(1|true)$"))
description = where clause: indicators not flagged stale by the OpenCTI knowledge decay rules.
iseval = 0

[opencti_prevalent_indicator]
definition = (pulse_prevalence IN ("common", "widespread"))
description = where clause: indicators commonly seen across the Threat Pulse network.
iseval = 0

[opencti_trending_indicator]
definition = (pulse_trend="rising")
description = where clause: indicators whose Threat Pulse trend is rising.
iseval = 0

#
# Telemetry inventory (OpenCTI - Telemetry inventory)
#
[opencti_inventory_scope]
definition = index=*
description = Data inventoried for the defense matrix telemetry (tstats where clause and metadata scope).
iseval = 0

[opencti_inventory_summariesonly]
definition = summariesonly=true allow_old_summaries=true
description = tstats options of the telemetry inventory. With summariesonly=true only accelerated data models count.
iseval = 0

#
# Hunts (OpenCTI internal-hunt/splunk connector and OpenCTI - Report hunt evidence)
#
[opencti_hunt_scope]
definition = index=*
description = Data the OpenCTI hunts may search. Restrict it (for example index=edr OR index=proxy) and give the hunt service account a role limited to the same indexes.
iseval = 0
