[opencti_index]
definition = index=opencti_stream
description = Specify the index used for OpenCTI data.
iseval = 0

#
# Indicator matching (OpenCTI - * detection searches)
#
[opencti_hits_scope]
definition = index=*
description = Data the detection searches match against the indicators, used in the where clause of tstats (for example index=proxy OR index=firewall).
iseval = 0

[opencti_hits_summariesonly]
definition = summariesonly=false allow_old_summaries=true
description = tstats options of the detection searches. Set summariesonly=true when the CIM data models are accelerated.
iseval = 0

[opencti_usable_indicator]
definition = (isnull(revoked) OR isnull(mvfind(revoked, "(?i)^(1|true)$")))
description = where clause keeping indicators that are not revoked (opencti_indicators lookup output); a multivalue revoked counts as revoked when any of its values is.
iseval = 0

[opencti_hits_match]
definition = lookup opencti_indicators value OUTPUT id AS indicator_id \
| where isnotnull(indicator_id) \
| eval indicator_id = mvdedup(indicator_id) \
| mvexpand indicator_id \
| lookup opencti_indicators id AS indicator_id OUTPUT revoked \
| where `opencti_usable_indicator`
description = Match a "value" field against the OpenCTI indicators held in Splunk: one row per matching indicator (several indicators can share a value), revoked ones left out.
iseval = 0

#
# Telemetry inventory (OpenCTI - Telemetry inventory)
#
[opencti_inventory_scope]
definition = index=*
description = Data inventoried for the defense matrix telemetry (tstats where clause and metadata scope).
iseval = 0

[opencti_inventory_summariesonly]
definition = summariesonly=true allow_old_summaries=true
description = tstats options of the telemetry inventory. With summariesonly=true only accelerated data models count.
iseval = 0
